<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>JEE Syllabus Tracker</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header>
    <h1>JEE Syllabus Tracker</h1>
    <p>Create a clean, printable A4 syllabus tracker PDF.</p>
  </header>

  <section class="card">
    <div class="grid">
      <div>
        <label>PDF Title</label>
        <input id="title" value="JEE SYLLABUS TRACKER">
      </div>
      <div>
        <label>Subject</label>
        <select id="subject">
          <option>PHYSICS</option>
          <option>CHEMISTRY</option>
          <option>MATHEMATICS</option>
        </select>
      </div>
    </div>
  </section>

  <section class="card">
    <h2>PDF Columns</h2>
    <p class="muted">Select only the columns you want.</p>
    <div id="columns" class="columns"></div>
  </section>

  <section class="card">
    <div class="section-title">
      <div>
        <h2>Chapters</h2>
        <p class="muted">Enter chapter name and total lectures.</p>
      </div>
      <button id="addChapter" class="primary">+ Add Chapter</button>
    </div>
    <div id="chapters"></div>
  </section>

  <section class="card">
    <h2>Preview</h2>
    <div id="preview" class="preview"></div>
  </section>

  <div class="actions">
    <button id="save" class="secondary">Save Tracker</button>
    <button id="download" class="primary">Download PDF</button>
    <button id="clear" class="danger">Clear All</button>
  </div>
</div>

<div id="toast"></div>
<script src="script.js"></script>
</body>
</html>
