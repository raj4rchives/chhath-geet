<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JEE Syllabus Tracker Generator</title>
  <style>
    :root {
      --primary-teal: #00a884;
      --border-color: #ccc;
    }

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background-color: #f4f6f8;
      color: #333;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    /* Input Form Styling */
    .form-container {
      background: white;
      padding: 25px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      margin-bottom: 30px;
    }

    h1, h2, h3 {
      margin-top: 0;
    }

    .subject-block {
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      padding: 15px;
      margin-bottom: 20px;
      background: #fafafa;
    }

    .subject-header-input {
      font-size: 1.1rem;
      font-weight: bold;
      margin-bottom: 10px;
      width: 100%;
      max-width: 300px;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    .chapter-row {
      display: flex;
      gap: 10px;
      margin-bottom: 8px;
      align-items: center;
    }

    .chapter-row input[type="text"] {
      flex: 3;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    .chapter-row input[type="number"] {
      flex: 1;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    .btn {
      padding: 8px 16px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.2s;
    }

    .btn-add {
      background-color: #e0e0e0;
      color: #333;
    }

    .btn-add:hover { background-color: #d0d0d0; }

    .btn-remove {
      background-color: #ff4d4d;
      color: white;
    }

    .btn-generate {
      background-color: var(--primary-teal);
      color: white;
      font-size: 1.1rem;
      padding: 12px 24px;
      width: 100%;
      margin-top: 15px;
    }

    .btn-generate:hover { opacity: 0.9; }

    /* PDF Printable Layout */
    #printable-tracker {
      background: white;
      padding: 20px;
      border-radius: 4px;
    }

    .tracker-main-header {
      font-size: 22px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 2px;
    }

    .tracker-subheader {
      font-size: 11px;
      color: #555;
      margin-bottom: 15px;
      font-weight: 600;
    }

    .subject-title {
      font-size: 16px;
      font-weight: bold;
      text-transform: uppercase;
      margin-top: 15px;
      margin-bottom: 8px;
    }

    table.tracker-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 20px;
      font-size: 10px;
    }

    table.tracker-table th, 
    table.tracker-table td {
      border: 1px solid #b0b0b0;
      padding: 4px 6px;
      text-align: center;
      vertical-align: middle;
    }

    table.tracker-table th {
      background-color: var(--primary-teal);
      color: white;
      font-size: 9px;
      font-weight: bold;
    }

    table.tracker-table td.chap-name {
      text-align: left;
      font-weight: 500;
      width: 18%;
    }

    table.tracker-table td.lec-tracker {
      text-align: left;
      width: 35%;
      word-spacing: 3px;
      line-height: 1.4;
      font-size: 8.5px;
      color: #444;
    }

    .checkbox-box {
      display: inline-block;
      width: 12px;
      height: 12px;
      border: 1px solid #444;
      border-radius: 1px;
      margin: 0 auto;
    }

    /* Print Controls */
    @media print {
      body {
        background: white;
        padding: 0;
      }
      .no-print {
        display: none !important;
      }
      #printable-tracker {
        padding: 0;
      }
      @page {
        size: A4 landscape;
        margin: 8mm;
      }
      table.tracker-table th {
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
        background-color: var(--primary-teal) !important;
        color: white !important;
      }
    }
  </style>
</head>
<body>

<div class="container">

  <!-- FORM SECTION -->
  <div class="form-container no-print">
    <h2>JEE Syllabus Tracker Generator</h2>
    <p>Apne 3 Subjects ke chapters aur total lectures fill karein aur printable PDF download karein.</p>
    
    <div id="subjects-inputs">
      <!-- Generated via JS -->
    </div>

    <button class="btn btn-generate" onclick="window.print()">🖨️ PDF Download / Print Karein</button>
  </div>

  <!-- PRINTABLE TRACKER VIEW -->
  <div id="printable-tracker">
    <div class="tracker-main-header">JEE SYLLABUS TRACKER</div>
    <div class="tracker-subheader">Lecture • JEE Main • Advanced • PYQ • Revision progress</div>

    <div id="tracker-output">
      <!-- Tables dynamically rendered here -->
    </div>
  </div>

</div>

<script>
  // Initial state for 3 subjects
  const defaultSubjects = [
    {
      name: "PHYSICS",
      chapters: [
        { name: "Laws of Motion", lec: 13 },
        { name: "Work, Energy and Power", lec: 6 },
        { name: "Circular Motion", lec: 8 },
        { name: "Rotational Motion", lec: 16 },
        { name: "Current Electricity", lec: 10 }
      ]
    },
    {
      name: "CHEMISTRY",
      chapters: [
        { name: "Some Basic Concepts of Chemistry", lec: 10 },
        { name: "Atomic Structure", lec: 12 },
        { name: "Chemical Bonding", lec: 14 }
      ]
    },
    {
      name: "MATHEMATICS",
      chapters: [
        { name: "Basic Mathematics & Logarithm", lec: 8 },
        { name: "Quadratic Equations", lec: 10 },
        { name: "Sequence and Series", lec: 11 }
      ]
    }
  ];

  function renderForm() {
    const container = document.getElementById('subjects-inputs');
    container.innerHTML = '';

    defaultSubjects.forEach((sub, subIdx) => {
      const subDiv = document.createElement('div');
      subDiv.className = 'subject-block';
      
      let chaptersHTML = '';
      sub.chapters.forEach((chap, chapIdx) => {
        chaptersHTML += `
          <div class="chapter-row">
            <input type="text" placeholder="Chapter Name" value="${chap.name}" oninput="updateChapter(${subIdx}, ${chapIdx}, 'name', this.value)">
            <input type="number" placeholder="Total Lec" value="${chap.lec}" min="1" oninput="updateChapter(${subIdx}, ${chapIdx}, 'lec', this.value)">
            <button class="btn btn-remove" onclick="removeChapter(${subIdx}, ${chapIdx})">✕</button>
          </div>
        `;
      });

      subDiv.innerHTML = `
        <input type="text" class="subject-header-input" value="${sub.name}" oninput="updateSubjectName(${subIdx}, this.value)">
        <div id="chapters-sub-${subIdx}">${chaptersHTML}</div>
        <button class="btn btn-add" onclick="addChapter(${subIdx})">+ Add Chapter</button>
      `;

      container.appendChild(subDiv);
    });

    renderTracker();
  }

  function updateSubjectName(subIdx, value) {
    defaultSubjects[subIdx].name = value;
    renderTracker();
  }

  function updateChapter(subIdx, chapIdx, field, value) {
    if(field === 'lec') {
      defaultSubjects[subIdx].chapters[chapIdx].lec = parseInt(value) || 0;
    } else {
      defaultSubjects[subIdx].chapters[chapIdx].name = value;
    }
    renderTracker();
  }

  function addChapter(subIdx) {
    defaultSubjects[subIdx].chapters.push({ name: "", lec: 5 });
    renderForm();
  }

  function removeChapter(subIdx, chapIdx) {
    defaultSubjects[subIdx].chapters.splice(chapIdx, 1);
    renderForm();
  }

  function generateLectureString(count) {
    let str = "";
    for(let i = 1; i <= count; i++) {
      str += `L${i} `;
    }
    return str.trim();
  }

  function renderTracker() {
    const output = document.getElementById('tracker-output');
    output.innerHTML = '';

    defaultSubjects.forEach(sub => {
      if(!sub.name) return;

      const title = document.createElement('div');
      title.className = 'subject-title';
      title.innerText = sub.name;
      output.appendChild(title);

      const table = document.createElement('table');
      table.className = 'tracker-table';

      table.innerHTML = `
        <thead>
          <tr>
            <th style="width: 3%;">#</th>
            <th style="width: 20%;">Chapter Name</th>
            <th style="width: 32%;">Lecture Tracker</th>
            <th style="width: 5%;">Total Lec</th>
            <th style="width: 5%;">Lec Comp</th>
            <th style="width: 4%;">JM Lec</th>
            <th style="width: 4%;">Adv Lec</th>
            <th style="width: 4%;">Short Notes</th>
            <th style="width: 4%;">DPP</th>
            <th style="width: 4%;">HW</th>
            <th style="width: 4%;">Module</th>
            <th style="width: 4%;">PYQ</th>
            <th style="width: 4%;">Adv Prob</th>
            <th style="width: 3%;">R1</th>
            <th style="width: 3%;">R2</th>
            <th style="width: 3%;">R3</th>
          </tr>
        </thead>
        <tbody>
          ${sub.chapters.map((chap, idx) => `
            <tr>
              <td>${idx + 1}</td>
              <td class="chap-name">${chap.name}</td>
              <td class="lec-tracker">${generateLectureString(chap.lec)}</td>
              <td>${chap.lec}</td>
              <td>0</td>
              <td><div class="checkbox-box"></div></td>
              <td><div class="checkbox-box"></div></td>
              <td><div class="checkbox-box"></div></td>
              <td><div class="checkbox-box"></div></td>
              <td><div class="checkbox-box"></div></td>
              <td><div class="checkbox-box"></div></td>
              <td><div class="checkbox-box"></div></td>
              <td><div class="checkbox-box"></div></td>
              <td><div class="checkbox-box"></div></td>
              <td><div class="checkbox-box"></div></td>
              <td><div class="checkbox-box"></div></td>
            </tr>
          `).join('')}
        </tbody>
      `;

      output.appendChild(table);
    });
  }

  // Initialize
  renderForm();
</script>

</body>
</html>
